name: Validate VIP TASK

on:
  push:
    branches:
      - vip-task-work
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: viptask
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d viptask"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/viptask
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q .
      - name: Run unit and PostgreSQL integration tests
        run: python -m unittest discover -s tests -v
      - name: Check Mini App JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script[^>]*>(.*?)</script>", html, re.S)
          Path("/tmp/vip-task.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/vip-task.js
      - name: Build production Docker image
        run: docker build --tag vip-task:ci .
